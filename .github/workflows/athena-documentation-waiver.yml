name: Athena Documentation Waiver

on:
  workflow_dispatch:
    inputs:
      repository:
        description: Repository name with owner.
        required: true
        type: string
      pr_number:
        description: Pull request number.
        required: true
        type: string
      head_sha:
        description: Exact pull request head commit being waived.
        required: true
        type: string
      base_ref:
        description: Harness base ref.
        required: true
        type: string
      base_sha:
        description: Exact base tip used to prepare the candidate.
        required: true
        type: string
      diff_base_sha:
        description: Merge base used to classify the candidate.
        required: true
        type: string
      deliverable_tree_sha:
        description: Candidate deliverable-tree identity.
        required: true
        type: string
      identity_version:
        description: Deliverable identity schema.
        required: true
        type: string
      waived_finding_codes:
        description: JSON array of documentation finding codes accepted by the human.
        required: true
        type: string
      reason:
        description: Human-readable reason for the exception.
        required: true
        type: string
      relay_run_id:
        description: Trusted default-branch relay workflow run.
        required: true
        type: string

permissions:
  actions: read
  checks: write
  contents: read
  pull-requests: read

concurrency:
  group: documentation-waiver-issuer-${{ inputs.head_sha }}
  cancel-in-progress: true

jobs:
  publish-waiver:
    name: Publish candidate-bound documentation waiver
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: athena-documentation-waiver

    steps:
      - name: Download immutable relay request
        uses: actions/download-artifact@v4
        with:
          name: athena-documentation-waiver-request-${{ inputs.relay_run_id }}
          path: relay-request
          github-token: ${{ github.token }}
          run-id: ${{ inputs.relay_run_id }}

      - name: Verify relay and protected-environment approval
        uses: actions/github-script@v8
        env:
          INPUT_REPOSITORY: ${{ inputs.repository }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          INPUT_HEAD_SHA: ${{ inputs.head_sha }}
          INPUT_BASE_REF: ${{ inputs.base_ref }}
          INPUT_BASE_SHA: ${{ inputs.base_sha }}
          INPUT_DIFF_BASE_SHA: ${{ inputs.diff_base_sha }}
          INPUT_DELIVERABLE_TREE_SHA: ${{ inputs.deliverable_tree_sha }}
          INPUT_IDENTITY_VERSION: ${{ inputs.identity_version }}
          INPUT_WAIVED_FINDING_CODES: ${{ inputs.waived_finding_codes }}
          INPUT_REASON: ${{ inputs.reason }}
          INPUT_RELAY_RUN_ID: ${{ inputs.relay_run_id }}
        with:
          script: |
            const repository = process.env.INPUT_REPOSITORY;
            const prNumber = Number(process.env.INPUT_PR_NUMBER);
            const headSha = process.env.INPUT_HEAD_SHA;
            const baseRef = process.env.INPUT_BASE_REF;
            const baseSha = process.env.INPUT_BASE_SHA;
            const diffBaseSha = process.env.INPUT_DIFF_BASE_SHA;
            const deliverableTreeSha = process.env.INPUT_DELIVERABLE_TREE_SHA;
            const identityVersion = process.env.INPUT_IDENTITY_VERSION;
            const reason = process.env.INPUT_REASON?.trim();
            const relayRunId = Number(process.env.INPUT_RELAY_RUN_ID);
            const trustedRequester = "github-actions[bot]";
            const allowedCodes = new Set(["compound-solution", "landed-change-report"]);
            const waivedFindingCodes = JSON.parse(process.env.INPUT_WAIVED_FINDING_CODES ?? "null");
            const relayEnvelope = JSON.parse(
              require("node:fs").readFileSync(
                "relay-request/documentation-waiver-request.json",
                "utf8",
              ),
            );
            const relayedInputs = relayEnvelope.inputs;
            const expectedRelayedInputs = {
              repository,
              pr_number: process.env.INPUT_PR_NUMBER,
              head_sha: headSha,
              base_ref: baseRef,
              base_sha: baseSha,
              diff_base_sha: diffBaseSha,
              deliverable_tree_sha: deliverableTreeSha,
              identity_version: identityVersion,
              waived_finding_codes: process.env.INPUT_WAIVED_FINDING_CODES,
              reason: process.env.INPUT_REASON,
            };
            const relayedInputKeys = Object.keys(relayedInputs).sort();
            const expectedRelayedInputKeys = Object.keys(expectedRelayedInputs).sort();
            const relayedInputsMatch =
              JSON.stringify(relayedInputKeys) ===
                JSON.stringify(expectedRelayedInputKeys) &&
              expectedRelayedInputKeys.every(
                (key) => relayedInputs[key] === expectedRelayedInputs[key],
              );
            if (repository !== `${context.repo.owner}/${context.repo.repo}`) {
              core.setFailed("The requested repository does not match this workflow repository.");
              return;
            }
            if (
              !Number.isInteger(prNumber) ||
              prNumber < 1 ||
              !Number.isInteger(relayRunId) ||
              relayRunId < 1 ||
              !reason
            ) {
              core.setFailed("The waiver request is missing its PR number or reason.");
              return;
            }
            if (
              !Array.isArray(waivedFindingCodes) ||
              waivedFindingCodes.length === 0 ||
              waivedFindingCodes.some((code) => !allowedCodes.has(code))
            ) {
              core.setFailed("The waiver request contains unsupported finding codes.");
              return;
            }

            const { data: reviews } = await github.request(
              "GET /repos/{owner}/{repo}/actions/runs/{run_id}/approvals",
              { ...context.repo, run_id: context.runId },
            );
            const { data: workflowRun } = await github.rest.actions.getWorkflowRun({
              ...context.repo,
              run_id: context.runId,
            });
            if (
              workflowRun.actor?.login !== trustedRequester ||
              workflowRun.actor?.type !== "Bot"
            ) {
              core.setFailed(
                "Only the repository-scoped GitHub Actions relay may request a portable waiver.",
              );
              return;
            }
            const { data: relayRun } = await github.rest.actions.getWorkflowRun({
              ...context.repo,
              run_id: relayRunId,
            });
            if (
              relayRun.event !== "workflow_dispatch" ||
              relayRun.path !== ".github/workflows/athena-documentation-waiver-request.yml" ||
              relayRun.head_branch !== "main" ||
              relayRun.conclusion !== "success" ||
              relayRun.actor?.type !== "User" ||
              !relayedInputsMatch
            ) {
              core.setFailed(
                "The waiver was not relayed by the trusted successful default-branch request workflow.",
              );
              return;
            }
            const approval = [...reviews].reverse().find(
              (review) =>
                review.state === "approved" &&
                review.user?.type === "User" &&
                review.environments?.some(
                  (environment) => environment.name === "athena-documentation-waiver",
                ),
            );
            if (!approval?.user?.login || approval.user.login === context.actor) {
              core.setFailed(
                "A separate human must approve the protected athena-documentation-waiver environment.",
              );
              return;
            }
            const { data: permission } =
              await github.rest.repos.getCollaboratorPermissionLevel({
                ...context.repo,
                username: approval.user.login,
              });
            if (!["admin", "maintain", "write"].includes(permission.permission)) {
              core.setFailed("The environment approver is not an authorized collaborator.");
              return;
            }

            const { data: pull } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: prNumber,
            });
            if (
              pull.head.sha !== headSha ||
              pull.base.sha !== baseSha ||
              `origin/${pull.base.ref}` !== baseRef
            ) {
              core.setFailed("The pull request head or base changed before approval.");
              return;
            }

            const verifiedContext = {
              schemaVersion: 4,
              kind: "documentation_waiver",
              repository,
              prNumber,
              headSha,
              deliverableTreeSha,
              identityVersion,
              baseRef,
              baseTipSha: baseSha,
              diffBaseSha,
              obligationId: "documentation.current",
              waivedFindingCodes: [...new Set(waivedFindingCodes)].sort(),
              requestedBy: relayRun.actor.login,
              requestedByType: relayRun.actor.type,
              relayedBy: workflowRun.actor.login,
              relayWorkflowRunId: relayRunId,
              passkeyApprovalId: relayEnvelope.passkeyApprovalId,
              approvedBy: approval.user.login,
              approvalEnvironment: "athena-documentation-waiver",
              reason,
              workflowRunId: context.runId,
              createdAt: new Date().toISOString(),
            };
            require("node:fs").writeFileSync(
              "verified-waiver-context.json",
              `${JSON.stringify(verifiedContext, null, 2)}\n`,
              { encoding: "utf8", mode: 0o600 },
            );

      - name: Consume verified iPhone passkey approval
        env:
          WAIVER_API_URL: ${{ vars.ATHENA_WAIVER_API_URL }}
          WAIVER_BROKER_SECRET: ${{ secrets.ATHENA_WAIVER_BROKER_SECRET }}
        run: |
          set -euo pipefail
          approval_id="$(jq -er '.passkeyApprovalId' verified-waiver-context.json)"
          jq '{
            repository,
            prNumber,
            headSha,
            baseRef,
            baseSha: .baseTipSha,
            diffBaseSha,
            deliverableTreeSha,
            identityVersion,
            waivedFindingCodes,
            reason
          }' verified-waiver-context.json > consume-candidate.json
          curl --fail-with-body --silent --show-error \
            --connect-timeout 10 --max-time 30 \
            --retry 3 --retry-all-errors --retry-delay 2 \
            --request POST \
            --header "Authorization: Bearer $WAIVER_BROKER_SECRET" \
            --header "Content-Type: application/json" \
            --data-binary @consume-candidate.json \
            "$WAIVER_API_URL/requests/$approval_id/consume" \
            > passkey-approval-receipt.json

      - name: Finalize passkey-bound attestation
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const context = JSON.parse(fs.readFileSync("verified-waiver-context.json", "utf8"));
          const receipt = JSON.parse(fs.readFileSync("passkey-approval-receipt.json", "utf8"));
          const approved = receipt.candidate ?? {};
          const matches =
            receipt.approvalId === context.passkeyApprovalId &&
            approved.repository === context.repository &&
            approved.prNumber === context.prNumber &&
            approved.headSha === context.headSha &&
            approved.baseRef === context.baseRef &&
            approved.baseSha === context.baseTipSha &&
            approved.diffBaseSha === context.diffBaseSha &&
            approved.deliverableTreeSha === context.deliverableTreeSha &&
            approved.identityVersion === context.identityVersion &&
            JSON.stringify(approved.waivedFindingCodes) === JSON.stringify(context.waivedFindingCodes) &&
            approved.reason === context.reason &&
            typeof receipt.credentialId === "string" && receipt.credentialId.length > 0 &&
            Number.isFinite(receipt.approvedAt);
          if (!matches) throw new Error("The consumed passkey approval does not match the verified candidate.");
          const attestation = {
            ...context,
            passkeyCredentialId: receipt.credentialId,
            passkeyApprovedAt: receipt.approvedAt,
          };
          fs.writeFileSync(
            "documentation-waiver-attestation.json",
            `${JSON.stringify(attestation, null, 2)}\n`,
            { encoding: "utf8", mode: 0o600 },
          );
          NODE
      - name: Publish immutable waiver attestation
        uses: actions/upload-artifact@v4
        with:
          name: athena-documentation-waiver-attestation
          path: documentation-waiver-attestation.json
          if-no-files-found: error
          retention-days: 90

      - name: Publish waiver check
        uses: actions/github-script@v8
        with:
          script: |
            const attestation = JSON.parse(
              require("node:fs").readFileSync(
                "documentation-waiver-attestation.json",
                "utf8",
              ),
            );
            await github.rest.checks.create({
              ...context.repo,
              name: "athena/documentation-waiver",
              head_sha: attestation.headSha,
              status: "completed",
              conclusion: "success",
              external_id: `athena-documentation-waiver/v1/${context.runId}`,
              details_url: `${context.serverUrl}/${attestation.repository}/actions/runs/${context.runId}`,
              output: {
                title: "Human documentation waiver accepted",
                summary: `Requested by ${attestation.requestedBy} and approved by ${attestation.approvedBy} for PR #${attestation.prNumber}.`,
              },
            });
