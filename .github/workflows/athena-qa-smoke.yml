name: Athena QA Smoke

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  workflow_run:
    workflows: [Athena QA Deploy]
    types: [completed]

permissions:
  contents: read

jobs:
  athena-qa-browser-smoke:
    name: Athena QA browser smoke
    if: github.repository == 'kwam1na/athena' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browser
        run: bunx playwright install chromium

      - name: Run Athena QA live browser smoke
        env:
          ATHENA_QA_URL: https://athena-qa.wigclub.store/
        run: bun run harness:behavior --scenario athena-qa-live-smoke --record-video

      - name: Sweep shared demo navigation and SKU journeys
        if: always()
        working-directory: packages/athena-webapp
        env:
          ATHENA_DEMO_URL: https://athena-qa.wigclub.store/
        run: bunx playwright test --config playwright.demo.config.ts

      - name: Upload QA smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: athena-qa-smoke-artifacts
          path: |
            artifacts/harness-behavior
            /tmp/athena-demo-navigation-results
            /tmp/athena-demo-navigation-report
          if-no-files-found: ignore
