<!DOCTYPE html>

<head>
  <meta charset="UTF-8">

  <meta name="description" content="Athena system overview architecture">
  <title>Athena System Overview</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
  <link href="./diagram-theme.css" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      padding: 48px 32px;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
    }

    main { width: min(100%, 1120px); margin: 0 auto; }
    .eyebrow { margin-bottom: 8px; color: var(--muted); font: 500 8px/1.5 var(--mono); letter-spacing: 0.18em; text-transform: uppercase; }
    h1 { margin-bottom: 8px; font: 400 28px/1.08 var(--serif); letter-spacing: -0.02em; }
    .subtitle { max-width: 720px; margin-bottom: 32px; color: var(--muted); font-size: 16px; line-height: 1.6; }
    .diagram { overflow-x: auto; }
    svg { display: block; width: 100%; min-width: 880px; height: auto; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Architecture · System Overview</p>
    <h1>One backend turns every channel action into shared business truth</h1>
